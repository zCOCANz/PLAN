function fundTransactionNet(f){

}
function recalculateFundBalance(f){
 f.transactions=Array.isArray(f.transactions)?f.transactions:[];
 if(f.openingBalance===undefined||f.openingBalance===null)f.openingBalance=Number(f.balance||0)-fundTransactionNet(f);
 f.openingBalance=Number(f.openingBalance||0);
 f.balance=f.openingBalance+fundTransactionNet(f);
 return f.balance;
}
function normalizeFunds(){
 d.funds=(Array.isArray(d.funds)?d.funds:[]).map(f=>{
  f.transactions=Array.isArray(f.transactions)?f.transactions:[];
  const history=Array.isArray(f.history)?f.history:[];
  history.forEach((h,i)=>{
   const legacyId='legacy-'+f.id+'-'+i;
   if(f.transactions.some(x=>x.id===legacyId))return;
   const kind=(h.type==='add'||h.type==='Thu')?'Thu':'Chi';
   f.transactions.push({id:legacyId,title:h.note||(kind==='Thu'?'Nạp quỹ':'Rút quỹ'),amount:Math.abs(Number(h.amount||0)),date:h.date||today(),note:h.note||'',type:kind});
  });
  recalculateFundBalance(f);
  return f;
 });
}
normalizeFunds();
// Chuẩn hóa dữ liệu tài chính cũ: khoản được thiết lập lặp theo tháng/quý/năm phải là mẫu định kỳ, để chỉ hiện ô □ trong mục Tài chính cho đến khi người dùng xác nhận.
function normalizeFinanceTemplates(){let changed=false;d.finance=d.finance.map(x=>{if(x&&!x.recurringSourceId&&['Hàng tháng','Hàng quý','Hàng năm'].includes(x.repeat)&&(!x.isRecurringTemplate||x.manuallyConfirmed===true)){changed=true;return {...x,isRecurringTemplate:true,manuallyConfirmed:false}}return x});if(changed){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}}
normalizeFinanceTemplates();
let tab='home',calendarSection='month',selectedDate=localDate(),trackMonth=localDate().slice(0,7),selectedHabitId=null,habitYear=String(new Date().getFullYear()),financeMonth=localDate().slice(0,7),financeAnnualView=true,financeSection='year',financeYear=String(new Date().getFullYear()),fundsVisible=true,selectedFundId=null,diaryMonth=localDate().slice(0,7);
// Tạo nội dung mẫu chỉ ở lần đầu hoàn toàn; dữ liệu đã có của người dùng không bị ghi đè.
if(!localStorage.getItem(KEY)){
 d.habits=[{id:'sample-habit-study',title:'Ôn bài / đọc sách 20 phút',emoji:'📚',days:[]},{id:'sample-habit-water',title:'Uống đủ nước',emoji:'💧',days:[]},{id:'sample-habit-move',title:'Vận động nhẹ',emoji:'🚶',days:[]}];
 d.visions=[{id:'sample-vision-study',title:'Học tập tiến bộ',caption:'Mỗi ngày hoàn thành một bước nhỏ',emoji:'📚',category:'Học tập',color:'lilac'},{id:'sample-vision-health',title:'Sống khỏe và cân bằng',caption:'Dành thời gian cho cơ thể và tinh thần',emoji:'🌿',category:'Sức khỏe',color:'mint'}];
 localStorage.setItem(KEY,JSON.stringify(d));
}const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>localDate(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(d));render();if(window.planCloudSave)window.planCloudSave(d)}catch(e){alert('Không lưu được dữ liệu trên trình duyệt. Hãy kiểm tra dung lượng hoặc quyền lưu trữ của trình duyệt.');console.error(e)}},dateLabel=x=>formatDateDisplay(x),card=(s,c='')=>`<section class="card ${c}">${s}</section>`,head=(t,s='',fn='')=>`<div class="head"><div><h2>${t}</h2><div class="sub">${s}</div></div>${fn?`<button type="button" class="btn soft" onclick="${fn.includes('(')?fn:fn+'()'}">＋ Thêm</button>`:''}</div>`,prog=n=>`<div class="progress"><div style="width:${n}%"></div></div>`,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function taskIsPerDay(t){return t.category==='Lưu ý'||(t.repeat||'Không lặp')!=='Không lặp'}
function taskDoneOn(t,date){return taskIsPerDay(t)?(Array.isArray(t.completedDates)&&t.completedDates.includes(date)):!!t.done}
function taskHTML(t,date=selectedDate,showOccurrenceDate=false){const checked=taskDoneOn(t,date);const categoryLabel='';return card(`<div class="task ${checked?'done':''}"><input type="checkbox" ${checked?'checked':''} onchange="toggleTask('${t.id}','${date}')"><div class="grow"><div class="tasktitle">${esc(t.title)}</div><div class="meta">${showOccurrenceDate?formatDateDisplay(date)+' · ':''}${esc(t.time||'Cả ngày')}${categoryLabel}</div>${t.notes?`<div class="sub">${esc(t.notes)}</div>`:''}</div><button class="btn soft" title="Sửa ngày / công việc" aria-label="Sửa" onclick="editTask('${t.id}')">✎</button><button class="btn soft" title="Xóa" onclick="removeTaskFromDate('${t.id}','${date}')">×</button></div>`)}
function uniqueFinanceYear(type,year){
 const seen=new Set(),out=d.finance.filter(x=>!x.isRecurringTemplate&&(!x.recurringSourceId||x.manuallyConfirmed===true)&&x.type===type&&x.date&&x.date.slice(0,4)===year).filter(x=>{if(!x.recurringSourceId)return true;const k=x.recurringSourceId+'|'+x.date.slice(0,7);if(seen.has(k))return false;seen.add(k);return true});
 d.finance.filter(x=>x.isRecurringTemplate&&x.type===type).forEach(t=>{
  (Array.isArray(t.confirmedMonths)?t.confirmedMonths:[]).forEach(m=>{
   if(!m.startsWith(String(year)+'-'))return;
   const start=String(t.date||today()).slice(0,7);if(m<start||(t.repeatUntil&&m>t.repeatUntil.slice(0,7)))return;
   const [sy,sm]=start.split('-').map(Number),[yy,mm]=m.split('-').map(Number);
   if(t.repeat==='Hàng quý'&&((yy-sy)*12+mm-sm)%3!==0)return;
   if(t.repeat==='Hàng năm'&&mm!==sm)return;
   const k=t.id+'|'+m;if(seen.has(k))return;
   const legacy=d.finance.some(r=>!r.isRecurringTemplate&&r.recurringSourceId===t.id&&r.manuallyConfirmed===true&&r.date&&r.date.slice(0,7)===m);if(legacy)return;
   seen.add(k);out.push({...t,date:m+'-01',isRecurringTemplate:false,_confirmedRecurringSummary:true});
  });
 });

}
function taskOccursOn(t,date){if(!t.date||date<t.date||(t.repeatUntil&&date>t.repeatUntil))return false;const dt=new Date(date+'T12:00:00'),start=new Date(t.date+'T12:00:00'),r=t.repeat||'Không lặp';if(r==='Không lặp')return t.date===date;if(r==='Hàng ngày'||r==='Hằng ngày')return true;if(r==='Hàng tuần'||r==='Hằng tuần'||r==='Thứ ... hàng tuần'){const weekday=Number(t.repeatWeekday);if(weekday>=1&&weekday<=7)return dt.getDay()+1===weekday;return Array.isArray(t.repeatDays)&&t.repeatDays.length?t.repeatDays.includes(dt.getDay()):dt.getDay()===start.getDay();}if(r==='Ngày ... hàng tháng')return dt.getDate()===Number(t.repeatDay||start.getDate());if(r==='Ngày đầu tiên mỗi tháng')return dt.getDate()===1;if(r==='Ngày cuối cùng mỗi tháng'){const n=new Date(dt);n.setDate(n.getDate()+1);return n.getDate()===1;}const lunar=lunarDayForSolar(date);if(r==='Ngày 1 âm lịch')return lunar.day===1;if(r==='Ngày 14 âm lịch')return lunar.day===14;if(r==='Ngày 15 âm lịch')return lunar.day===15;if(r==='Ngày cuối tháng âm lịch')return lunar.last;return false}
function habitMonthOverviewHTML(){
 const [yy,mm]=trackMonth.split('-').map(Number),first=new Date(yy,mm-1,1),daysInMonth=new Date(yy,mm,0).getDate(),offset=(first.getDay()+6)%7;
 const personalTasks=d.tasks.filter(t=>t.category==='Thói quen');
 if(!selectedHabitId||!personalTasks.some(t=>t.id===selectedHabitId))selectedHabitId=personalTasks[0]?.id||'';
 const task=personalTasks.find(t=>t.id===selectedHabitId);
 const options=personalTasks.map(t=>`<option value="${esc(t.id)}" ${t.id===selectedHabitId?'selected':''}>${esc((t.emoji||'🌱')+' '+t.title)}</option>`).join('');
 const cells=Array.from({length:offset},()=>'<span class="dayblank"></span>');
 let count=0;
 for(let day=1;day<=daysInMonth;day++){
  const date=`${trackMonth}-${String(day).padStart(2,'0')}`,occurs=!!task&&taskOccursOn(task,date),done=occurs&&taskDoneOn(task,date);
  if(done)count++;
  cells.push(`<div class="daycell habit-overview-day ${date===today()?'today':''}" style="background:#fff;border-color:${done?'#8bc9a7':'#eee5ef'}" title="${date}" aria-label="${day}${done?' - đã thực hiện':''}"><span>${day}</span><b style="font-size:19px;color:#27834a!important">${done?'🌱':''}</b></div>`);

}

function habitHeatmapHTML(item){
 const year=Number(habitYear);
 const monthNames=['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
 const firstMonth=0,lastMonth=11;
 const start=new Date(year,firstMonth,1),end=new Date(year,lastMonth+1,0);
 const mondayOffset=(start.getDay()+6)%7,gridStart=new Date(year,firstMonth,1-mondayOffset);
 const totalDays=Math.ceil((end-gridStart)/86400000)+1,weekCount=Math.ceil(totalDays/7);
 const cells=[];
 for(let w=0;w<weekCount;w++)for(let dow=0;dow<7;dow++){
  const dt=new Date(gridStart);dt.setDate(gridStart.getDate()+w*7+dow);
  const ds=localDate(dt),inside=dt>=start&&dt<=end;

 }

function deleteFinanceFromSelectedMonth(id){
 const item=d.finance.find(x=>x.id===id);if(!item)return;
 if(!item.isRecurringTemplate){if(confirm('Bạn có chắc muốn xóa khoản này?')){d.finance=d.finance.filter(x=>x.id!==id);closeForm();save()}return}
 const month=financeMonth||today().slice(0,7);
 if(!confirm('Dừng khoản lặp từ tháng '+month.split('-').reverse().join('/')+' trở đi? Các tháng trước vẫn được giữ nguyên.'))return;
 const start=String(item.date||today()).slice(0,7);
 // Xóa các bản ghi lặp cũ từ tháng đang chọn trở đi, giữ nguyên các tháng trước.
 d.finance=d.finance.filter(x=>!(x.recurringSourceId===id&&x.date&&x.date.slice(0,7)>=month));
 item.confirmedMonths=(Array.isArray(item.confirmedMonths)?item.confirmedMonths:[]).filter(m=>m<month);
 item.unconfirmedMonths=(Array.isArray(item.unconfirmedMonths)?item.unconfirmedMonths:[]).filter(m=>m<month);
 if(month<=start){d.finance=d.finance.filter(x=>x.id!==id)}
 else {const [yy,mm]=month.split('-').map(Number);const prev=new Date(yy,mm-2,1);const end=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0')+'-'+String(new Date(prev.getFullYear(),prev.getMonth()+1,0).getDate()).padStart(2,'0');if(!item.repeatUntil||item.repeatUntil>end)item.repeatUntil=end;}
 closeForm();save();
}

function toggleRecurringFinance(id,month,checked){
 const template=d.finance.find(x=>x.id===id&&x.isRecurringTemplate);
 if(!template){render();return}
 const confirmed=Array.isArray(template.confirmedMonths)?template.confirmedMonths.filter(m=>m!==month):[];
 const unconfirmed=Array.isArray(template.unconfirmedMonths)?template.unconfirmedMonths.filter(m=>m!==month):[];
 if(checked){confirmed.push(month)}else{unconfirmed.push(month)}
 template.confirmedMonths=[...new Set(confirmed)];
 template.unconfirmedMonths=[...new Set(unconfirmed)];
 save();
}

  if (panel) panel.style.display = (window.planPushPromptActive && isUnlocked && isSignedIn) ? 'block' : 'none';
};
window.planPushPromptActive = false;
window.planShowPushPromptOnce = function(uid){
  if(!uid)return;
  const key='plan_push_prompt_seen_'+String(uid);
  try{
    if(localStorage.getItem(key))return;
    localStorage.setItem(key,'1');
    window.planPushPromptActive=true;
    window.planUpdatePushPanel();
  }catch(e){console.warn('Không lưu được trạng thái lời mời thông báo',e);}
};
window.planDismissPushPrompt = function(){
  window.planPushPromptActive=false;
  const panel=document.getElementById('plan-push-panel');
  if(panel)panel.style.display='none';
};

window.planInitOneSignal = function() {
  if (window.planOneSignalInitStarted || window.planOneSignalReady) return;
  window.planOneSignalInitStarted = true;
  const status = document.getElementById('plan-push-status');
  if (status) status.textContent = 'Đang kết nối dịch vụ thông báo…';

  window.OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.init({
        appId: window.PLAN_ONESIGNAL_APP_ID,
        serviceWorkerPath: "/PLAN/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/PLAN/" },
        notifyButton: { enable: false }
      });
      window.planOneSignalReady = true;
      if(window.PLAN_PUSH_EXTERNAL_ID && OneSignal.login){
        try{ await OneSignal.login(String(window.PLAN_PUSH_EXTERNAL_ID)); }catch(e){ console.warn('PLAN OneSignal deferred login failed',e); }
      }
      const permission = (OneSignal.Notifications && OneSignal.Notifications.permission)
        ? OneSignal.Notifications.permission
        : (('Notification' in window) && Notification.permission === 'granted');
      if (status) {
        status.textContent = permission
          ? 'Thiết bị đã cấp quyền thông báo. Có thể nhận thông báo đẩy.'
          : 'Đã kết nối. Nhấn “Bật thông báo” và cho phép trên thiết bị.';
      }
      window.planUpdatePushPanel();
    } catch (error) {
      window.planOneSignalInitStarted = false;
      console.error('PLAN OneSignal init error:', error);
      if (status) status.textContent =
        'Chưa kết nối được. Kiểm tra OneSignalSDKWorker.js, HTTPS và cấu hình Website URL trong OneSignal.';
      window.planUpdatePushPanel();
    }
  });
};

window.planEnablePush = function() {
  const status = document.getElementById('plan-push-status');
  if (!window.planOneSignalReady) {
    if (status) status.textContent = 'Dịch vụ đang kết nối. Hãy đợi vài giây rồi thử lại.';
    if (window.planInitOneSignal) window.planInitOneSignal();
    return;
  }
  window.OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.Notifications.requestPermission();
      const granted = ('Notification' in window) && Notification.permission === 'granted';
      if (status) status.textContent = granted
        ? 'Đã cấp quyền trên thiết bị này. Hãy gửi thông báo thử từ OneSignal để kiểm tra.'
        : 'Chưa được cấp quyền. Bạn có thể bật lại trong cài đặt thiết bị khi cần.';
      window.planDismissPushPrompt();
    } catch (error) {
      console.error('PLAN notification permission error:', error);
      if (status) status.textContent =
        'Không bật được quyền. Trên iPhone/iPad, hãy mở PLAN từ biểu tượng đã thêm vào Màn hình chính, sau đó thử lại.';
    }
  });
};

// Nếu SDK tải chậm hoặc lỗi mạng, người dùng vẫn có thể thử kết nối lại.
window.planRetryOneSignal = function() {
  window.planOneSignalInitStarted = false;
  window.planOneSignalReady = false;
  window.planInitOneSignal();
};
</script>
<div id="plan-push-panel" role="region" aria-label="Thông báo PLAN" style="display:none">
  <strong>🔔 Thông báo PLAN</strong>
  <p>Cho phép PLAN gửi thông báo đến thiết bị này. Lời nhắc đúng giờ sẽ được máy chủ kiểm tra và gửi qua OneSignal ngay cả khi PLAN không mở.</p>
  <div style="display:flex;gap:7px;flex-wrap:wrap">
    <button id="plan-push-button" type="button" onclick="planEnablePush()">Bật thông báo</button>

<script id="plan-real-push-reminders">
/* PLAN: liên kết người dùng đăng nhập với OneSignal bằng external_id.
   Cloud Function sẽ dùng external_id này để gửi thông báo kể cả khi PLAN không mở. */
window.planBindPushUser = function(uid){
  if(!uid) return;
  window.PLAN_PUSH_EXTERNAL_ID = uid;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      if(OneSignal.login) await OneSignal.login(String(uid));
      const status=document.getElementById('plan-push-status');
      if(status) status.textContent='Đã liên kết thiết bị với tài khoản PLAN. Lời nhắc sẽ được gửi từ máy chủ.';
    }catch(e){console.error('OneSignal login/external id error',e);}
  });
};

// Kiểm tra foreground để có phản hồi ngay khi app đang mở. Server vẫn là nguồn chính
// cho thông báo màn hình khóa và nhắc lặp lại khi app đã đóng.
window.planCheckScheduleRemindersNow = function(){
  try{ if(typeof checkScheduleReminders==='function') checkScheduleReminders(); }catch(e){ console.error(e); }
};
window.addEventListener('focus',window.planCheckScheduleRemindersNow);
</script>
